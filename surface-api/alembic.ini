# Alembic: migrations per Surface (shared core). Run from inside surface-api/.
#
# Each Surface owns one Alembic branch (label = its name) whose revisions live in
# `<name>/db/migrations/`; shared core owns the `_base` branch in `_base/db/migrations/`. A revision
# that needs another branch's table declares `depends_on`. The older SQL stream in `migrations/`
# (migrate.py) is closed: the `_base` baseline revision requires all of it to be applied first.
#
# Applying is a human-approved step (AGENTS.md §4): backup, `alembic upgrade heads`, verify by
# JOIN, log in docs/ETL-Enhancements.md. The environment lives in `alembic_env/` because `migrations/`
# is the SQL stream.
[alembic]
script_location = %(here)s/alembic_env
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = newline
version_locations =
    %(here)s/_base/db/migrations
    %(here)s/sales/db/migrations
    %(here)s/marketing/db/migrations
    %(here)s/search/db/migrations
    %(here)s/srp/db/migrations
    %(here)s/xmp/db/migrations
    %(here)s/campaigns/db/migrations
    %(here)s/etl/db/migrations
    %(here)s/graph/db/migrations
    %(here)s/nora_os/db/migrations
    %(here)s/skills/db/migrations
    %(here)s/conversion_agents/db/migrations
    %(here)s/admin/db/migrations
    %(here)s/ops/db/migrations
    %(here)s/integrations/db/migrations
    %(here)s/reports/db/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

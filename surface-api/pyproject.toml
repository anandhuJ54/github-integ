[project]
name = "surface-api"
version = "0.1.0"
description = "Expertise Engine — React SPA + FastAPI, Surface-oriented"
requires-python = ">=3.11"
dependencies = [
    # Pin the fastapi line and its starlette: an unpinned resolve picked
    # fastapi 0.159 + starlette 1.9 where include_router silently mounts nothing.
    "fastapi>=0.115,<0.116",
    "starlette>=0.40,<0.42",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    # Connection pooling for the read/write split (primary + optional read replica).
    "psycopg-pool>=3.2",
    "pyjwt>=2.9",
]

[dependency-groups]
# Dev/CI tooling. `uv sync` installs these by default, so core-gates' `ruff`/`pytest` resolve.
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.ruff]
# Python-side lint for this self-contained backend project. DB-side controls (RLS, governed
# functions) stay authoritative; the repo-level enforcement lint lives in tools/ (stdlib).
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008: calling Depends()/Security() in argument defaults is the idiomatic FastAPI pattern.
# N999: the project-root dir (`surface-api`) is hyphenated by design — it is not an importable
# module; the importable top-level packages (`_base`, `sales`, …) are all valid names.
ignore = ["B008", "N999"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["*_test.py", "test_*.py"]
